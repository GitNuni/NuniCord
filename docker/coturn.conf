# coturn TURN/STUN server configuration for NuniCord

# Listening port
listening-port=3478
tls-listening-port=5349

# Listening IPs (0.0.0.0 = all interfaces)
listening-ip=0.0.0.0

# External/relay IP (set via environment variable)
# relay-ip=YOUR_EXTERNAL_IP

# Use environment variable for external IP
# This is handled via docker-compose environment

# Authentication
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Realm
realm=${TURN_REALM}

# User credentials (long-term credential mechanism as fallback)
user=${TURN_USER}:${TURN_PASSWORD}

# Log settings
log-file=/var/log/coturn/turnserver.log
verbose
no-stdout-log

# Security
no-tlsv1
no-tlsv1_1
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Performance
min-port=49152
max-port=65535
max-bps=0
total-quota=0
user-quota=0

# STUN only (no-relay for local-only setups)
# no-relay

# Fingerprint in TURN message
fingerprint

# Enable multicast peers
# no-multicast-peers

# Cipher list for TLS
cipher-list="ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AESGCM:RSA+AES:RSA+3DES:!aNULL:!MD5:!DSS"
