# NuniCord — Dockge stack
# Drop this file into /opt/stacks/nunicord/compose.yaml on your server.
# Edit the environment variables below before starting.

services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: nunicord/app:latest
    container_name: nunicord_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001

      # ── Database ──────────────────────────────
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nunicord
      POSTGRES_USER: nunicord
      POSTGRES_PASSWORD: change_me           # ← CHANGE

      # ── Redis ─────────────────────────────────
      REDIS_URL: redis://redis:6379

      # ── Auth ──────────────────────────────────
      JWT_SECRET: change_me_to_a_long_random_secret  # ← CHANGE
      JWT_EXPIRES_IN: 7d

      # ── App ───────────────────────────────────
      NUNICORD_MODE: multi                   # multi | single
      CORS_ORIGIN: "*"
      TRUST_PROXY: "false"                   # set "true" if behind Caddy/nginx

      # ── File uploads ──────────────────────────
      UPLOAD_DIR: /uploads
      MAX_FILE_SIZE_MB: "100"

      # ── Push notifications (optional) ─────────
      # Generate with: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_EMAIL: admin@nunicord.local

      # ── OAuth (optional) ──────────────────────
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      OAUTH_CALLBACK_URL: http://localhost:3001

      # ── Voice / TURN ──────────────────────────
      TURN_HOST: localhost
      TURN_SECRET: change_me_turn_secret     # ← CHANGE if using coturn

      # ── Misc ──────────────────────────────────
      RATE_LIMIT_MAX: "1000"
      LOG_LEVEL: info
    volumes:
      - uploads:/uploads
    ports:
      - "3001:3001"
    networks:
      - nunicord
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: nunicord_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nunicord
      POSTGRES_USER: nunicord
      POSTGRES_PASSWORD: change_me           # ← match app above
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - nunicord
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nunicord -d nunicord"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB

  redis:
    image: redis:7-alpine
    container_name: nunicord_redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --save 300 100
        --save 900 1
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - nunicord
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Caddy (optional — remove if using your own reverse proxy) ──────────────
  caddy:
    image: caddy:2-alpine
    container_name: nunicord_caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: localhost                       # ← your domain
      CADDY_EMAIL: admin@nunicord.local       # ← for Let's Encrypt
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nunicord

  # ── coturn TURN server (optional — needed for voice/video across NAT) ──────
  coturn:
    image: coturn/coturn:latest
    container_name: nunicord_coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: change_me_turn_secret     # ← match app above
      TURN_REALM: nunicord.local
    volumes:
      - ./docker/coturn.conf:/etc/coturn/turnserver.conf:ro
      - coturn_logs:/var/log/coturn
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=65535
      --use-auth-secret
      --static-auth-secret=change_me_turn_secret
      --realm=nunicord.local
      --no-tlsv1
      --no-tlsv1_1
      --fingerprint
      --no-stdout-log

networks:
  nunicord:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
  caddy_logs:
  coturn_logs:
